spring.application.name=logistik

# ---- JMeter ----
# Absoluter Pfad zum JMeter-Installationsverzeichnis (z.B. C:/tools/apache-jmeter-5.6.3)
jmeter.home=C:/tools/apache-jmeter-5.6.3
# ↑ Pfad anpassen falls die Version anders heißt, z.B. apache-jmeter-5.6.3

# ---- Actuator / Monitoring ----
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
# Spring Boot 4: "unrestricted" statt enabled=true
management.endpoint.prometheus.access=unrestricted
management.endpoint.health.access=unrestricted
management.metrics.tags.application=${spring.application.name}
server.port=${PORT:8081}
logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false
vaadin.launch-browser=true
# ---- Datasource -----
# Profil setzen: local (Docker) oder neon (NeonDB)
# In IntelliJ: Run Config -> Active profiles: local
# Auf dem Server: Umgebungsvariable SPRING_PROFILES_ACTIVE=neon
spring.profiles.active=local
spring.datasource.driver-class-name=org.postgresql.Driver
# ---- HikariCP Connection Pool ----
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
# ---- Spring Jpa ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# ---- RabbitMQ ----
amqp.centralExchange= central
amqp.centralApplication=logistik
spring.rabbitmq.ssl.enabled=true
spring.rabbitmq.host=cow.rmq2.cloudamqp.com
spring.rabbitmq.port=5671
spring.rabbitmq.username=tgamtfjc
spring.rabbitmq.password=LGl-i3KF-JuaNxoPrUGCNsffR9AYfo-i
spring.rabbitmq.virtual-host=tgamtfjc
# ---- OpenAPI / Swagger ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
