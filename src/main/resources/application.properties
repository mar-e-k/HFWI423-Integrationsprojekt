spring.application.name=logistik

# ---- JMeter ----
# Absoluter Pfad zum JMeter-Installationsverzeichnis (z.B. C:/tools/apache-jmeter-5.6.3)
jmeter.home=C:/tools/apache-jmeter-5.6.3
# ↑ Pfad anpassen falls die Version anders heißt, z.B. apache-jmeter-5.6.3

# ---- Actuator / Monitoring ----
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
# Spring Boot 4: "unrestricted" statt enabled=true
management.endpoint.prometheus.access=unrestricted
management.endpoint.health.access=unrestricted
management.metrics.tags.application=${spring.application.name}
server.port=${PORT:8081}
logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false
vaadin.launch-browser=true
# ---- Datasource -----
spring.datasource.url=jdbc:postgresql://ep-still-sky-agzvzwl9-pooler.c-2.eu-central-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_nb2oUpM1CmPX&sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_nb2oUpM1CmPX
spring.datasource.driver-class-name=org.postgresql.Driver
# ---- HikariCP Connection Pool ----
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
# ---- Spring Jpa ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
# ---- RabbitMQ ----
amqp.centralExchange= central
amqp.centralApplication=logistik
spring.rabbitmq.ssl.enabled=true
spring.rabbitmq.host=cow.rmq2.cloudamqp.com
spring.rabbitmq.port=5671
