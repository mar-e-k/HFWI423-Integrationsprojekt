x-vendix-app-common: &vendix-app-common
  build:
    context: ../..
    dockerfile: .docker/app/Dockerfile
  restart: unless-stopped
  profiles:
    - apps
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - app

x-vendix-app-environment: &vendix-app-environment
  SPRING_PROFILES_ACTIVE: docker
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  VENDIX_ORCHESTRATOR_BASE_URL: http://orchestrator:8080
  VENDIX_SECURITY_JWT_EXPIRATION: 24h

services:

  postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app

  rabbitmq:
    image: rabbitmq:4.2.4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_SERVER_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app

  keycloak:
    image: keycloak/keycloak:26.6
    profiles:
      - auth
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: ${KEYCLOAK_PORT}
    ports:
      - "${KEYCLOAK_PORT}:8090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  orchestrator:
    <<: *vendix-app-common
    image: vendix/orchestrator:local
    build:
      context: ../..
      dockerfile: .docker/app/Dockerfile
      args:
        APP_MODULE: orchestrator
    environment:
      <<: *vendix-app-environment
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=orchestrator
    ports:
      - "${ORCHESTRATOR_PORT}:8080"
    expose:
      - "8080"
    networks:
      - app

  store:
    <<: *vendix-app-common
    image: vendix/store:local
    build:
      context: ../..
      dockerfile: .docker/app/Dockerfile
      args:
        APP_MODULE: store
    environment:
      <<: *vendix-app-environment
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=store
      SPRING_DATASOURCE_READ_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=store
      SPRING_DATASOURCE_READ_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_READ_PASSWORD: ${POSTGRES_PASSWORD}
      VENDIX_TESTING_SIMULATE_RANDOM_ARTICLE_ORDER: "false"
    expose:
      - "8081"
    networks:
      - app

  pos:
    <<: *vendix-app-common
    image: vendix/pos:local
    build:
      context: ../..
      dockerfile: .docker/app/Dockerfile
      args:
        APP_MODULE: pos
    environment:
      <<: *vendix-app-environment
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=pos
    expose:
      - "8082"
    networks:
      - app

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  app:
    external: true
