services:

  k6:
    image: grafana/k6:1.7.1-with-browser
    container_name: vendix-k6
    volumes:
      - ./k6/scripts:/etc/k6/scripts
    entrypoint: ["sleep", "infinity"]
    ports:
      - "${K6_PORT}:3020"
      # k6 Web Dashboard – erreichbar unter http://localhost:5665 während ein Test läuft
      - "5665:5665"
    environment:
      # ─── Prometheus Remote-Write ─────────────────────────────────────────────
      # k6 pusht Metriken live an Prometheus → sichtbar in Grafana
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(50),p(90),p(95),p(99),min,max,avg
      - K6_PROMETHEUS_RW_PUSH_INTERVAL=5s
      - K6_PROMETHEUS_RW_STALE_MARKERS=true

      # ─── k6 Web Dashboard ────────────────────────────────────────────────────
      # Aktiviert das eingebaute Live-Dashboard auf http://localhost:5665
      # Zeigt: VUs, Iterations/s, HTTP-Fehler, Response Time, Checks – alles in Echtzeit
      # Hinweis: Solange das Browser-Fenster offen ist, wartet k6 mit dem Beenden.
      #          → Einfach Browser-Tab schließen wenn Test fertig ist.
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_HOST=0.0.0.0      # Muss 0.0.0.0 sein, damit Port nach außen erreichbar ist
      - K6_WEB_DASHBOARD_PORT=5665
      - K6_WEB_DASHBOARD_OPEN=false         # Kein automatisches Browser-Öffnen im Container

    extra_hosts:
      # Damit k6 den Spring-Boot-Host erreichen kann (Store + Orchestrator)
      - "host.docker.internal:host-gateway"
    networks:
      - app
      - monitor-net

networks:
  app:
    external: true
  monitor-net:
    external: true