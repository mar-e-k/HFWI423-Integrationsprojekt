services:

  k6:
    image: grafana/k6:1.7.1-with-browser
    container_name: vendix-k6
    volumes:
      - ./k6/scripts:/etc/k6/scripts
      # Reports-Ordner: HTML-Report nach jedem Test hier verfügbar
      # Host-Pfad: .docker/testing/k6/reports/
      - ./k6/reports:/etc/k6/reports
    entrypoint: ["sleep", "infinity"]
    ports:
      - "${K6_PORT}:3020"
      - "5665:5665"
    environment:
      # ─── Prometheus Remote-Write ──────────────────────────────────────────
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(50),p(90),p(95),p(99),min,max,avg
      - K6_PROMETHEUS_RW_PUSH_INTERVAL=5s
      - K6_PROMETHEUS_RW_STALE_MARKERS=true
      # ─── k6 Web Dashboard ─────────────────────────────────────────────────
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_HOST=0.0.0.0
      - K6_WEB_DASHBOARD_PORT=5665
      - K6_WEB_DASHBOARD_OPEN=false
      # K6_WEB_DASHBOARD_EXPORT wird pro Test vom PerformanceTestService gesetzt
      # und enthält den Pfad zur HTML-Report-Datei im Container.
      - ORCHESTRATOR_URL=${K6_ORCHESTRATOR_URL}
      - STORE_URL=${K6_STORE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app
      - monitor-net

networks:
  app:
    external: true
  monitor-net:
    external: true
