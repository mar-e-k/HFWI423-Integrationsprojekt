name: vendix

services:
  orchestrator:
    build:
      context: ../..
      dockerfile: .docker/local/orchestrator.Dockerfile
    container_name: orchestrator
    ports:
      - "8080:8080"
    networks:
      - vendix-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  store:
    build:
      context: ../..
      dockerfile: .docker/local/store.Dockerfile
    container_name: store
    depends_on:
      - orchestrator
    networks:
      - vendix-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pos:
    build:
      context: ../..
      dockerfile: .docker/local/pos.Dockerfile
    container_name: pos
    depends_on:
      - orchestrator
      - store
    networks:
      - vendix-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  vendix-network:
    external: true