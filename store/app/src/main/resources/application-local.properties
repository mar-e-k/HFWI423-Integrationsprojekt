# Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/store_db
spring.datasource.username=admin
spring.datasource.password=admin

# ── PostgreSQL Read-DataSource (Read-Replica) ─────────────────────────────────
# In der lokalen Entwicklungsumgebung zeigt der Read-Pool auf dieselbe DB.
# In Produktion hier URL der Read-Replica eintragen:
#   spring.datasource.read.url=jdbc:postgresql://replica-host:5432/postgres
spring.datasource.read.url=${spring.datasource.url}
spring.datasource.read.username=${spring.datasource.username}
spring.datasource.read.password=${spring.datasource.password}
spring.datasource.read.hikari.maximum-pool-size=15
spring.datasource.read.hikari.minimum-idle=5

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Hibernate Batch-Processing ────────────────────────────────────────────────
# Auch mit IDENTITY-Strategie helfen diese Einstellungen bei UPDATE- und
# DELETE-Operationen. Für INSERT-Batching nutzen wir JdbcTemplate direkt
# (CheckoutServiceImpl → ReceiptLineBulkRepositoryImpl).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ── HikariCP Write-Pool ───────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ── Tomcat Thread Pool ────────────────────────────────────────────────────────
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200
server.tomcat.connection-timeout=20000
