type: object
description: Represents a sales receipt.
properties:
  id:
    type: integer
    format: int64
    nullable: true
  storeId:
    type: integer
    format: int64
  registerId:
    type: integer
    format: int64
  cashierId:
    type: integer
    format: int64
  paymentMethod:
    $ref: "./PaymentMethod.yaml"
  status:
    $ref: "./ReceiptStatus.yaml"
example:
  id: 42
  storeId: 1
  registerId: 2
  cashierId: 4
  paymentMethod: CASH
  status: OPEN