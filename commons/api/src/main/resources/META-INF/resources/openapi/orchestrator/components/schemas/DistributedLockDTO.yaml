type: object
description: Represents a distributed lock on a resource.
properties:
  target:
    $ref: "./EntityTargetDTO.yaml"
  instanceUUID:
    type: string
    format: uuid
  acquiredAt:
    type: string
    format: date-time
  expiresAt:
    type: string
    format: date-time
example:
  target:
    id: 101
    type: "STORE"
  instanceUUID: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
  acquiredAt: "2023-10-27T10:00:00Z"
  expiresAt: "2023-10-27T11:00:00Z"