type: object
description: Represents an article in the store.
properties:
  id:
    type: integer
    format: int64
  gtin:
    type: string
    description: The Global Trade Item Number of the article.
  name:
    type: string
  description:
    type: string
  manufacturer:
    type: string
  supplier:
    type: string
  unit:
    type: string
  purchasePrice:
    type: number
    format: double
  sellingPrice:
    type: number
    format: double
  taxRate:
    type: number
    format: double
  stock:
    type: integer
    format: int64
  isAvailable:
    type: boolean
  isDeposit:
    type: boolean
example:
  id: 1
  gtin: "10000001"
  name: "Apfel"
  description: "apfel"
  manufacturer: "FreshFarms"
  supplier: "EuroFruit GmbH"
  unit: "kg"
  purchasePrice: 0.80
  sellingPrice: 1.20
  taxRate: 7.7
  stock: 50
  isAvailable: true
  isDeposit: false