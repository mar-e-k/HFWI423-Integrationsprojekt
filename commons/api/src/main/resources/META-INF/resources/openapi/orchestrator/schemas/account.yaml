AccountDTO:
  type: object
  description: Represents a user account.
  properties:
    id:
      type: integer
      format: int64
    uuid:
      type: string
      format: uuid
    username:
      type: string
    password:
      type: string
      format: password
    firstName:
      type: string
    middleName:
      type: string
    lastName:
      type: string
    phone:
      type: string
      pattern: "^\\+[1-9]\\d{1,14}$"
    email:
      type: string
      format: email
  example:
    id: 1
    uuid: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
    username: "johndoe"
    password: "password123"
    firstName: "John"
    middleName: "M"
    lastName: "Doe"
    phone: "+1234567890"
    email: "johndoe@example.com"