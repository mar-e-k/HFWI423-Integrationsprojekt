StoreDTO:
  type: object
  description: Represents a store location.
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    country:
      type: string
    city:
      type: string
    street:
      type: string
    streetNumber:
      type: string
  example:
    id: 101
    name: "Main Store"
    country: "Germany"
    city: "Berlin"
    street: "Musterstrasse"
    streetNumber: "1"