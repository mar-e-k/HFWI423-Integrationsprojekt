type: object
description: Full checkout request — creates a receipt with all line items at once.
required:
  - storeId
  - registerId
  - cashierId
  - paymentMethod
  - lines
properties:
  storeId:
    type: integer
    format: int64
    example: 1
  registerId:
    type: integer
    format: int64
    example: 2
  cashierId:
    type: integer
    format: int64
    example: 4
  paymentMethod:
    $ref: "./PaymentMethod.yaml"
  lines:
    type: array
    minItems: 1
    items:
      $ref: "./CheckoutLineDTO.yaml"