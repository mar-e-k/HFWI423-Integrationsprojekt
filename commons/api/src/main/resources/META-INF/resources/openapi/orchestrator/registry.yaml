openapi: 3.0.3
info:
  title: Vendix Orchestrator Registry API
  version: 1.0.0
paths:
  /api/registry/register:
    post:
      summary: Register a new instance
      operationId: registerInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Instance registered
  /api/registry/heartbeat/{instanceId}:
    put:
      summary: Send keep-alive heartbeat
      operationId: sendHeartbeat
    parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
components:
  schemas:
    RegistrationRequest:
      type: object
      required: [instanceId, appType, port]
      properties:
        instanceId:
          type: string
          example: "uuid-123"
        appType:
          type: string
          enum: [store, pos]
        port:
          type: integer
          example: 54321
        context:
          type: string
          description: "Optional: Store ID or POS ID if already known"