post:
  operationId: checkout
  summary: Create a receipt with all line items (full checkout)
  description: >
    Creates a receipt together with all article positions in a single
    transaction. This is the primary endpoint for completing a sale at the
    cash register. The receipt starts with status OPEN.
  tags:
    - Checkout
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/CheckoutRequestDTO.yaml"
        example:
          storeId: 1
          registerId: 2
          cashierId: 4
          paymentMethod: CASH
          lines:
            - articleId: 5
              articleAmount: 2
              discountPercent: null
            - articleId: 17
              articleAmount: 1
              discountPercent: 10.00
  responses:
    '201':
      description: Checkout successful. Returns the created receipt ID and line IDs.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/CheckoutResponseDTO.yaml"
    '400':
      description: Invalid request body (e.g. empty lines, unknown articleId).