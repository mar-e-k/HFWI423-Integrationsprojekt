openapi: 3.0.0

info:
  title: Store
  description: Store
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Account
    description: Operations related to Accounts

paths:
  /api/account/id/{id}:
    get:
      tags:
        - Account
      operationId: getAccountById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successfully Retrieve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /api/account/id/{id}/roles:
    get:
      tags:
        - Account
      operationId: getAccountRolesById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Account/properties/id"
      responses:
        200:
          description: Successfully Retrieve
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountRole"

  /api/account/uuid/{uuid}:
    get:
      tags:
        - Account
      operationId: getAccountByUUID
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Account/properties/uuid"
      responses:
        200:
          description: Successfully Retrieve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /api/account/username/{username}:
    get:
      tags:
        - Account
      operationId: getAccountByUsername
      parameters:
        - name: username
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Account/properties/username"
      responses:
        200:
          description: Successfully Retrieve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
          format: password
    AccountRole:
      type: string
      enum:
        - CASHIER
        - ADMIN
        - SYSTEM