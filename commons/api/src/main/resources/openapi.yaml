openapi: 3.0.0

info:
  title: Store
  description: Store
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Account
    description: Operations related to Accounts
  - name: Lock
    description: Operations related to Locks

paths:
  /api/account:
    get:
      operationId: getAccounts
      description: Get Accounts by parameters
      tags:
        - Account
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: uuid
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: username
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: Successfully retrieved Accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDTO"

  /api/lock:
    get:
      operationId: getLocks
      description: Get Locks by parameters
      tags:
        - Lock
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: targetType
          in: query
          required: false
          schema:
            type: string
            enum:
              - STORE
              - REGISTER
              - ACCOUNT
        - name: targetId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successfully retrieved Locks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockDTO"
    post:
      operationId: createLock
      description: Creates a Lock
      tags:
        - Lock
      requestBody:
        description: "Lock"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockDTO"
      responses:
        201:
          description: Successfully created Lock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockDTO"
        409:
          description: Lock already exists

  /api/lock/expired:
    delete:
      operationId: deleteExpiredLocks
      description: Deletes all expired locks
      tags:
        - Lock
      responses:
        204:
          description: Deleted expired Locks

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AccountDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
          format: password

    LockDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        targetType:
          type: string
          enum:
            - STORE
            - REGISTER
            - ACCOUNT
        targetId:
          type: integer
          format: int64
        instanceUUID:
          type: string
          format: uuid
        acquiredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time