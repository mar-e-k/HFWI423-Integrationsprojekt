openapi: 3.0.0

info:
  title: Store
  description: Store
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Account
    description: Operations related to Accounts

paths:
  /api/account:
    get:
      operationId: getAccount
      description: "Get Account by Parameters"
      tags:
        - Account
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: uuid
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: username
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successfully retrieved account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
          format: password
    AccountRole:
      type: string
      enum:
        - CASHIER
        - ADMIN
        - SYSTEM