openapi: 3.0.0

info:
  title: Orchestrator API
  description: This API provides operations for managing connections, locks, accounts, and stores.
  version: 1.0.0

tags:
  - name: Connection
    description: Operations related to service connections.
  - name: DistributedLock
    description: Operations related to resource locking.
  - name: Account
    description: Operations related to user accounts.
  - name: Store
    description: Operations related to stores.
  - name: Register
    description: Operations related to registers.

servers:
  - url: http://localhost:8080
    description: Local development server.

security:
  - bearerAuth: [ ]

paths:
  /api/connection:
    post:
      operationId: postConnection
      summary: Create a new connection
      description: Creates a new connection for a service instance.
      tags:
        - Connection
      requestBody:
        description: The connection object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionDTO"
      responses:
        '201':
          description: The connection was successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionDTO"
        '409':
          description: A connection for this service instance already exists.

  /api/connection/type/{type}:
    get:
      operationId: getConnectionsByType
      summary: Get connections by target type
      description: Retrieves a list of all connections with the specified target type.
      tags:
        - Connection
      parameters:
        - in: path
          name: type
          description: The type of the target resource.
          required: true
          schema:
            $ref: "#/components/schemas/TargetType"
      responses:
        '200':
          description: A list of connections was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectionDTO"

  /api/connection/type/{type}/id/{id}:
    get:
      operationId: getConnectionByTarget
      summary: Get connection by target
      description: Retrieves a connection by its target resource.
      tags:
        - Connection
      parameters:
        - in: path
          name: type
          description: The type of the target resource.
          required: true
          schema:
            $ref: "#/components/schemas/TargetType"
        - in: path
          name: id
          description: The ID of the target resource.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The requested connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionDTO"
        '404':
          description: A connection for the specified target was not found.
    delete:
      operationId: deleteConnectionByTarget
      summary: Delete connection by target
      description: Deletes a connection by its target resource.
      tags:
        - Connection
      parameters:
        - in: path
          name: type
          description: The type of the target resource.
          required: true
          schema:
            $ref: "#/components/schemas/TargetType"
        - in: path
          name: id
          description: The ID of the target resource.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The connection was successfully deleted.

  /api/connection/uuid/{uuid}:
    get:
      operationId: getConnectionByInstanceUUID
      summary: Get connection by instance UUID
      description: Retrieves a connection by the UUID of the service instance.
      tags:
        - Connection
      parameters:
        - in: path
          name: uuid
          description: The UUID of the service instance.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionDTO"
        '404':
          description: A connection with the specified UUID was not found.
    delete:
      operationId: deleteConnectionByInstanceUuid
      summary: Delete connection by instance UUID
      description: Deletes a connection by the UUID of the service instance.
      tags:
        - Connection
      parameters:
        - in: path
          name: uuid
          description: The UUID of the service instance.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The connection was successfully deleted.

  /api/lock:
    post:
      operationId: postDistributedLock
      summary: Create a new distributed lock
      description: Creates a new lock on a resource.
      tags:
        - DistributedLock
      requestBody:
        description: The lock object to be created.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistributedLockDTO"
      responses:
        '201':
          description: The lock was successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributedLockDTO"
        '409':
          description: The resource is already locked.

  /api/lock/type/{type}:
    get:
      operationId: getDistributedLocksByType
      summary: Get distributed locks by target type
      description: Retrieves a list of all locks with the specified target type.
      tags:
        - DistributedLock
      parameters:
        - in: path
          name: type
          description: The type of the target resource.
          required: true
          schema:
            $ref: "#/components/schemas/TargetType"
      responses:
        '200':
          description: A list of locks was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributedLockDTO"

  /api/lock/type/{type}/id/{id}:
    get:
      operationId: getDistributedLockByTarget
      summary: Get distributed lock by target
      description: Retrieves a lock by its target resource.
      tags:
        - DistributedLock
      parameters:
        - in: path
          name: type
          description: The type of the locked resource.
          required: true
          schema:
            $ref: "#/components/schemas/TargetType"
        - in: path
          name: id
          description: The ID of the locked resource.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The requested lock.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributedLockDTO"
        '404':
          description: A lock for the specified target was not found.
    delete:
      operationId: deleteDistributedLockByTarget
      summary: Delete distributed lock by target
      description: Deletes a lock by its target resource.
      tags:
        - DistributedLock
      parameters:
        - in: path
          name: type
          description: The type of the locked resource.
          required: true
          schema:
            $ref: "#/components/schemas/TargetType"
        - in: path
          name: id
          description: The ID of the locked resource.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The lock was successfully deleted.

  /api/lock/uuid/{uuid}:
    get:
      operationId: getAllDistributedLocksByInstanceUUID
      summary: Get all distributed locks by instance UUID
      description: Retrieves all locks held by a specific service instance.
      tags:
        - DistributedLock
      parameters:
        - in: path
          name: uuid
          description: The UUID of the service instance.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of locks was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributedLockDTO"
    delete:
      operationId: deleteAllDistributedLocksByInstanceUUID
      summary: Delete all distributed locks by instance UUID
      description: Deletes all locks held by a specific service instance.
      tags:
        - DistributedLock
      parameters:
        - in: path
          name: uuid
          description: The UUID of the service instance.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: All locks for the specified instance were successfully deleted.

  /api/account/username/{username}:
    get:
      operationId: getAccountByUsername
      summary: Get account by username
      description: Retrieves a single account by its username.
      tags:
        - Account
      parameters:
        - in: path
          name: username
          required: true
          description: The username of the account.
          schema:
            type: string
      responses:
        '200':
          description: The requested account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDTO"
        '404':
          description: An account with the specified username was not found.

  /api/account/id/{id}:
    get:
      operationId: getAccountById
      summary: Get account by ID
      description: Retrieves a single account by its ID.
      tags:
        - Account
      parameters:
        - in: path
          name: id
          required: true
          description: The ID of the account.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The requested account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDTO"
        '404':
          description: An account with the specified ID was not found.

  /api/account/id/{id}/roles:
    get:
      operationId: getAccountRolesById
      summary: Get account roles by ID
      description: Retrieves the roles of a specific account.
      tags:
        - Account
      parameters:
        - in: path
          name: id
          required: true
          description: The ID of the account.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of account roles was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountRoleDTO"

  /api/account/uuid/{uuid}:
    get:
      operationId: getAccountByUuid
      summary: Get account by UUID
      description: Retrieves a single account by its UUID.
      tags:
        - Account
      parameters:
        - in: path
          name: uuid
          required: true
          description: The UUID of the account.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDTO"
        '404':
          description: An account with the specified UUID was not found.

  /api/store/locked:
    get:
      operationId: getLockedStores
      summary: Get all locked stores
      description: Retrieves a list of all stores that are currently locked.
      tags:
        - Store
      responses:
        '200':
          description: A list of locked stores was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreDTO"

  /api/store/unlocked:
    get:
      operationId: getUnlockedStores
      summary: Get all unlocked stores
      description: Retrieves a list of all stores that are not currently locked.
      tags:
        - Store
      responses:
        '200':
          description: A list of unlocked stores was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreDTO"

  /api/store/id/{id}:
    get:
      operationId: getStoreById
      summary: Get store by ID
      description: Retrieves a single store by its ID.
      tags:
        - Store
      parameters:
        - in: path
          name: id
          required: true
          description: The ID of the store.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The requested store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreDTO"
        '404':
          description: A store with the specified ID was not found.

  /api/store/{storeId}/register:
    get:
      operationId: getRegistersByStoreId
      summary: Get all registers for a store
      description: Retrieves a list of all registers associated with a specific store.
      tags:
        - Register
      parameters:
        - in: path
          name: storeId
          required: true
          description: The ID of the store.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of registers was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegisterDTO"

  /api/store/{storeId}/register/locked:
    get:
      operationId: getLockedRegistersByStoreId
      summary: Get locked registers for a store
      description: Retrieves a list of locked registers for a specific store.
      tags:
        - Register
      parameters:
        - in: path
          name: storeId
          required: true
          description: The ID of the store.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of locked registers was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegisterDTO"

  /api/store/{storeId}/register/unlocked:
    get:
      operationId: getUnlockedRegistersByStoreId
      summary: Get unlocked registers for a store
      description: Retrieves a list of unlocked registers for a specific store.
      tags:
        - Register
      parameters:
        - in: path
          name: storeId
          required: true
          description: The ID of the store.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of unlocked registers was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegisterDTO"

  /api/register/id/{id}:
    get:
      operationId: getRegisterById
      summary: Get register by ID
      description: Retrieves a single register by its ID.
      tags:
        - Register
      parameters:
        - in: path
          name: id
          required: true
          description: The ID of the register.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The requested register.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDTO"
        '404':
          description: A register with the specified ID was not found.

  /api/register/locked:
    get:
      operationId: getLockedRegisters
      summary: Get all locked registers
      description: Retrieves a list of all registers that are currently locked.
      tags:
        - Register
      responses:
        '200':
          description: A list of locked registers was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegisterDTO"

  /api/register/unlocked:
    get:
      operationId: getUnlockedRegisters
      summary: Get all unlocked registers
      description: Retrieves a list of all registers that are not currently locked.
      tags:
        - Register
      responses:
        '200':
          description: A list of unlocked registers was successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegisterDTO"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Bearer token for authentication. Example: 'Bearer {token}'"

  schemas:
    ConnectionDTO:
      type: object
      description: Represents a connection from a service instance to a target resource.
      properties:
        id:
          type: integer
          format: int64
        target:
          $ref: "#/components/schemas/EntityTargetDTO"
        instance:
          $ref: "#/components/schemas/InstanceDetailsDTO"
        acquiredAt:
          type: string
          format: date-time
        heartbeatAt:
          type: string
          format: date-time
        failedAttempts:
          type: integer
          format: int64
        connectionState:
          $ref: "#/components/schemas/ConnectionState"

      example:
        id: 1
        target:
          id: 101
          type: "STORE"
        instance:
          uuid: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
          host: "localhost"
          server: "store-service-1"
          port: 8080
        acquiredAt: "2023-10-27T10:00:00Z"
        heartbeatAt: "2023-10-27T10:05:00Z"
        failedAttempts: 0
        connectionState: UP

    DistributedLockDTO:
      type: object
      description: Represents a distributed lock on a resource.
      properties:
        target:
          $ref: "#/components/schemas/EntityTargetDTO"
        instanceUUID:
          type: string
          format: uuid
        acquiredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      example:
        target:
          id: 101
          type: "STORE"
        instanceUUID: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        acquiredAt: "2023-10-27T10:00:00Z"
        expiresAt: "2023-10-27T11:00:00Z"

    EntityTargetDTO:
      type: object
      description: Represents a target resource.
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TargetType"
      example:
        id: 101
        type: "STORE"

    TargetType:
      type: string
      description: The type of a target resource.
      enum:
        - STORE
        - REGISTER
        - ACCOUNT
        - ORCHESTRATOR

    ConnectionState:
      type: string
      description: The state of the connection.
      enum:
        - UP
        - DOWN

    InstanceDetailsDTO:
      type: object
      description: Represents the details of a service instance.
      properties:
        uuid:
          type: string
          format: uuid
        host:
          type: string
        server:
          type: string
        port:
          type: integer
          format: int64
      example:
        uuid: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        host: "DESKTOP-AH8CD"
        server: "localhost"
        port: 8080

    AccountDTO:
      type: object
      description: Represents a user account.
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
          format: password
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          pattern: "^\\+[1-9]\\d{1,14}$"
        email:
          type: string
          format: email
      example:
        id: 1
        uuid: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
        username: "johndoe"
        password: "password123"
        firstName: "John"
        middleName: "M"
        lastName: "Doe"
        phone: "+1234567890"
        email: "johndoe@example.com"

    AccountRoleDTO:
      type: object
      description: Represents a role assigned to an account.
      properties:
        id:
          type: integer
          format: int64
        role:
          $ref: "#/components/schemas/Role"
      example:
        id: 1
        role: "ADMIN"

    Role:
      type: string
      description: The role of a user, which determines their access level and permissions.
      enum:
        - CASHIER
        - ADMIN
        - SYSTEM
      example:
        - CASHIER: "Standard user role with access to cashier-related functions."
        - ADMIN: "Administrator role with elevated permissions to manage users, stores, and system settings."
        - SYSTEM: "System-level role for automated processes and internal services."

    StoreDTO:
      type: object
      description: Represents a store location.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        country:
          type: string
        city:
          type: string
        street:
          type: string
        streetNumber:
          type: string
      example:
        id: 101
        name: "Main Store"
        country: "Germany"
        city: "Berlin"
        street: "Musterstrasse"
        streetNumber: "1"

    RegisterDTO:
      type: object
      description: Represents a cash register in a store.
      properties:
        id:
          type: integer
          format: int64
        storeId:
          type: integer
          format: int64
      example:
        id: 1
        storeId: 101