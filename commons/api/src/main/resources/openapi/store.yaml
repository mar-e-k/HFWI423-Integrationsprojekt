openapi: 3.0.0

info:
  title: Store
  description: Store
  version: 1.0.0

tags:
  - name: Article
    description: Operations related to Articles
  - name: Receipt
    description: Operations related to Receipts

security:
  - bearerAuth: []

paths:
  /api/article/:
    get:
      operationId: getArticles
      description: d
      tags:
        - Article
      parameters:
        - in: query
          name: id
          required: false
          description: d
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: d
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArticleDTO"

  /api/receipt/:
    post:
      operationId: postReceipt
      description: d
      tags:
        - Receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptDTO"
      responses:
        200:
          description: d
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceiptDTO"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ArticleDTO:
      type: object
      description: d
      properties:
        id:
          type: integer
          format: int64

    ReceiptDTO:
      type: object
      description: d
      properties:
        id:
          type: integer
          format: int64