openapi: 3.0.3

info:
  title: Prometheus Target Discovery API
  description: |
    Provides Prometheus-compatible target groups for file-based or HTTP service discovery.
    The response format strictly follows Prometheus file_sd_config expectations.
  version: 1.0.0

tags:
  - name: Prometheus
    description: Prometheus service discovery endpoints

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /prometheus/targets:
    get:
      operationId: getPrometheusTargets
      summary: Get Prometheus scrape targets
      description: |
        Returns a list of target groups in Prometheus file-based service discovery format.
        This endpoint can be used for:
        - file_sd_configs (via generated file)
        - http_sd_configs (direct integration)
      tags:
        - Prometheus
      responses:
        '200':
          description: List of Prometheus target groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TargetGroup'
              examples:
                default:
                  summary: Example target groups
                  value:
                    - targets: ["localhost:8081", "localhost:8082"]
                      labels:
                        app: store
                        environment: local
                    - targets: ["localhost:8091"]
                      labels:
                        app: register
                        environment: local

components:
  schemas:
    TargetGroup:
      type: object
      description: |
        A group of scrape targets as expected by Prometheus.
      required:
        - targets
      properties:
        targets:
          type: array
          description: List of scrape targets in host:port format
          items:
            type: string
            pattern: '^[^:]+:\d+$'
            example: localhost:8081

        labels:
          type: object
          description: |
            Key-value pairs attached to all targets in this group.
            Common labels include:
            - app
            - instance
            - environment
          additionalProperties:
            type: string
          example:
            app: store
            instance: store-1
            environment: local

        metadata:
          type: object
          description: |
            Internal metadata not used by Prometheus.
            Safe to ignore by Prometheus consumers.
          additionalProperties: true
          properties:
            serviceType:
              type: string
              enum: [store, register]