# Server
server.port=8080
server.reactive.session.cookie.name=REACTIVE_${spring.application.name}
server.servlet.session.cookie.name=SERVLET_${spring.application.name}

# Application
spring.application.name=orchestrator
spring.profiles.default=local
spring.profiles.active=local

# Monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=read_only

# AMQP Messaging
amqp.central-exchange=central
amqp.central-application=${spring.application.name}