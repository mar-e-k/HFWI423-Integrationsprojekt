# Application
spring.application.name=orchestrator
spring.profiles.default=local
spring.profiles.active=local

# Oauth2
## Orchestrator Web
spring.security.oauth2.client.registration.keycloak.client-id=orchestrator-web
spring.security.oauth2.client.registration.keycloak.client-secret=${ORCHESTRATOR_WEB_SECRET}
## Orchestrator App
spring.security.oauth2.client.registration.orchestrator-app.provider=keycloak
spring.security.oauth2.client.registration.orchestrator-app.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.orchestrator-app.client-id=orchestrator-app
spring.security.oauth2.client.registration.orchestrator-app.client-secret=${ORCHESTRATOR_APP_SECRET}