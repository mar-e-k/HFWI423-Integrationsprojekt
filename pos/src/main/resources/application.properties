# --- Server ---
server.port=0
server.reactive.session.cookie.name=REACTIVE_{spring.application.name}
server.servlet.session.cookie.name=SERVLET_${spring.application.name}
server.filialsystem.uri=http://localhost:8080

# --- App ---
spring.application.name=kassensystem
spring.profiles.active=prod

# --- App Config ---
spring.kassensystem.cashier.password=1234

# --- App Startup ---
spring.kassensystem.connect-to-filial=true

# --- JPA ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator ---
management.endpoints.web.exposure.include=health, info