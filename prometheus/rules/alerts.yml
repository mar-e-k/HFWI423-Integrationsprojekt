groups:
  - name: einkauf-service-alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: DatabaseConnectionPoolExhausted
        expr: |
          hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "{{ $value | humanizePercentage }} of database connections are in use"

      - alert: OrderProcessingLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(einkauf_service_orders_processing_time_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High order processing latency"
          description: "95th percentile order processing time is {{ $value }}s"

      - alert: CacheMissRateHigh
        expr: |
          rate(einkauf_service_cache_misses_total[5m]) / (rate(einkauf_service_cache_hits_total[5m]) + rate(einkauf_service_cache_misses_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High cache miss rate"
          description: "Cache miss rate is {{ $value | humanizePercentage }}"

      - alert: CheckoutFailureRateHigh
        expr: |
          rate(einkauf_service_checkouts_failed_total[5m]) / (rate(einkauf_service_checkouts_completed_total[5m]) + rate(einkauf_service_checkouts_failed_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High checkout failure rate"
          description: "Checkout failure rate is {{ $value | humanizePercentage }}"

      - alert: AMQPEventProcessingErrors
        expr: |
          rate(einkauf_service_amqp_events_processing_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AMQP event processing errors detected"
          description: "{{ $value }} errors per second in AMQP event processing"

